[profile.default]
optimizer = true
optimizer_runs = 200

src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "shanghai"


[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"
anvil = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY:-}", url = "https://api-sepolia.basescan.org/api" }
